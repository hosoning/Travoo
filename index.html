<!DOCTYPE html>
<html lang="zh-CN" data-color-mode="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" id="theme-color-meta" content="#000000">
<title>Travoo</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;overscroll-behavior:none}

:root{
  --bg:#0a0a0f;--bg-rgb:10,10,15;
  --sf-r:255;--sf-g:255;--sf-b:255;
  --blur-xs:16px;--blur-sm:28px;--blur-md:48px;--blur-lg:72px;
  --sat:180%;--bri:1.03;
  --glass-bg:rgba(255,255,255,0.07);
  --glass-bg2:rgba(255,255,255,0.11);
  --glass-bg3:rgba(255,255,255,0.17);
  --glass-border:rgba(255,255,255,0.11);
  --glass-border2:rgba(255,255,255,0.18);
  --glass-shadow:0 6px 32px rgba(0,0,0,0.4),0 1px 4px rgba(0,0,0,0.15),inset 0 0.5px 0 rgba(255,255,255,0.15);
  --glass-shadow-sm:0 3px 16px rgba(0,0,0,0.24),inset 0 0.5px 0 rgba(255,255,255,0.1);
  --glass-inner:linear-gradient(180deg,rgba(255,255,255,0.06) 0%,transparent 50%);
  --t1:rgba(255,255,255,0.95);--t2:rgba(255,255,255,0.58);--t3:rgba(255,255,255,0.34);--t4:rgba(255,255,255,0.14);
  --blue:#0A84FF;--green:#30D158;--orange:#FF9F0A;--red:#FF453A;--purple:#BF5AF2;--teal:#00C7BE;
  --blue-rgb:10,132,255;--green-rgb:48,209,88;--orange-rgb:255,159,10;--red-rgb:255,69,58;--purple-rgb:191,90,242;
  --accent:#ffffff;--accent-rgb:255,255,255;
  --r:22px;--r2:16px;--r3:12px;--r4:10px;
  --sai:env(safe-area-inset-top,44px);--sab:env(safe-area-inset-bottom,34px);
  --tabh:calc(54px + var(--sab));
  --sp:cubic-bezier(0.22,1,0.36,1);
  --sp2:cubic-bezier(0.34,1.4,0.64,1);
  --ease:cubic-bezier(0.25,0.46,0.45,0.94);
  --sheet-bg:rgba(16,16,20,0.94);
}
html[data-color-mode="light"]{
  --sf-r:0;--sf-g:0;--sf-b:0;--bg:#f0f0f5;--bg-rgb:240,240,245;
  --glass-bg:rgba(255,255,255,0.70);--glass-bg2:rgba(255,255,255,0.82);--glass-bg3:rgba(255,255,255,0.94);
  --glass-border:rgba(0,0,0,0.06);--glass-border2:rgba(0,0,0,0.09);
  --glass-shadow:0 3px 24px rgba(0,0,0,0.07),0 1px 3px rgba(0,0,0,0.03),inset 0 0.5px 0 rgba(255,255,255,0.9);
  --glass-shadow-sm:0 2px 10px rgba(0,0,0,0.05),inset 0 0.5px 0 rgba(255,255,255,0.8);
  --glass-inner:linear-gradient(180deg,rgba(255,255,255,0.5) 0%,transparent 60%);
  --t1:rgba(0,0,0,0.90);--t2:rgba(0,0,0,0.54);--t3:rgba(0,0,0,0.34);--t4:rgba(0,0,0,0.14);
  --sheet-bg:rgba(248,248,252,0.96);
}
html,body{background:var(--bg);color:var(--t1);transition:background .5s var(--ease)}

#wp{position:fixed;inset:0;z-index:0;transition:opacity .5s}
#wp.img{background-size:cover;background-position:center}
#wp.img::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,0.42)}
html[data-color-mode="light"] #wp:not(.img){display:none}

#app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

.g{
  background:var(--glass-bg);
  backdrop-filter:blur(var(--blur-md)) saturate(var(--sat)) brightness(var(--bri));
  -webkit-backdrop-filter:blur(var(--blur-md)) saturate(var(--sat)) brightness(var(--bri));
  border:0.5px solid var(--glass-border);box-shadow:var(--glass-shadow);
  position:relative;overflow:hidden;
}
.g::before{content:'';position:absolute;inset:0;border-radius:inherit;background:var(--glass-inner);pointer-events:none;z-index:0}
.g>*{position:relative;z-index:1}

.view{
  position:absolute;inset:0;
  display:none;flex-direction:column;overflow:hidden;
  will-change:opacity,transform;
}
.view.active{display:flex}
.view.anim-in{animation:vIn .24s var(--sp) both}
.view.anim-left{animation:vLeft .22s var(--sp) both}
.view.anim-right{animation:vRight .22s var(--sp) both}
@keyframes vIn{from{opacity:0;transform:scale(0.97) translateY(10px)}to{opacity:1;transform:none}}
@keyframes vLeft{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes vRight{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}

.scroller{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--tabh)+28px);scroll-behavior:smooth}
.scroller::-webkit-scrollbar{display:none}

.nav{flex-shrink:0;padding:calc(var(--sai)+8px) 16px 8px;
  display:flex;align-items:center;gap:10px;position:relative;z-index:10}
.nav-title{font-size:17px;font-weight:600;position:absolute;left:50%;transform:translateX(-50%);
  white-space:nowrap;pointer-events:none;color:var(--t1);letter-spacing:-.2px}
.nav-large{font-size:32px;font-weight:700;letter-spacing:-.8px;flex:1;color:var(--t1);line-height:1}
.nbtn{width:34px;height:34px;border-radius:50%;
  background:var(--glass-bg);backdrop-filter:blur(var(--blur-sm));-webkit-backdrop-filter:blur(var(--blur-sm));
  border:0.5px solid var(--glass-border);box-shadow:var(--glass-shadow-sm);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t1);flex-shrink:0;
  transition:all .15s var(--sp);will-change:transform}
.nbtn:active{transform:scale(0.76);background:var(--glass-bg3)}
.nbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.tabs{position:fixed;bottom:0;left:0;right:0;z-index:200;
  display:grid;grid-template-columns:1fr 1fr 68px 1fr 1fr;align-items:center;
  padding:6px 4px var(--sab);
  background:var(--glass-bg2);
  backdrop-filter:blur(var(--blur-lg)) saturate(var(--sat));
  -webkit-backdrop-filter:blur(var(--blur-lg)) saturate(var(--sat));
  border-top:0.5px solid var(--glass-border)}
.tab{display:flex;align-items:center;justify-content:center;height:44px;cursor:pointer;
  border-radius:var(--r3);transition:all .2s var(--sp);will-change:transform}
.tab:active{transform:scale(0.74)}
.tab svg{width:22px;height:22px;stroke:var(--t3);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:all .25s var(--sp)}
.tab.on svg{stroke:var(--accent);filter:drop-shadow(0 0 5px rgba(var(--accent-rgb),.5));transform:scale(1.1)}
.tab-center{width:54px;height:54px;border-radius:50%;margin:0 auto;
  display:flex;align-items:center;justify-content:center;
  background:var(--glass-bg2);backdrop-filter:blur(var(--blur-md));-webkit-backdrop-filter:blur(var(--blur-md));
  border:0.5px solid var(--glass-border2);
  box-shadow:0 3px 20px rgba(var(--accent-rgb),.12),var(--glass-shadow);
  cursor:pointer;transition:all .25s var(--sp);will-change:transform}
.tab-center:active{transform:scale(0.82)}
.tab-center.on{background:rgba(var(--accent-rgb),.13);border-color:rgba(var(--accent-rgb),.28)}
.tab-center svg{width:23px;height:23px;stroke:var(--t1);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:13px 18px;border-radius:var(--r2);font-size:15px;font-weight:600;
  cursor:pointer;border:none;font-family:inherit;transition:all .18s var(--sp);letter-spacing:-.1px;will-change:transform}
.btn:active{transform:scale(0.93);opacity:.84}
.btn:disabled{opacity:.38;pointer-events:none}
.btn-full{width:100%;display:flex}
.btn-p{background:var(--t1);color:var(--bg);box-shadow:0 3px 16px rgba(var(--sf-r),var(--sf-g),var(--sf-b),.18)}
.btn-g{background:var(--glass-bg);backdrop-filter:blur(var(--blur-sm));-webkit-backdrop-filter:blur(var(--blur-sm));
  border:0.5px solid var(--glass-border);color:var(--t1);box-shadow:var(--glass-shadow-sm)}
.btn-g:active{background:var(--glass-bg2)}
.btn-d{background:rgba(var(--red-rgb),.12);border:0.5px solid rgba(var(--red-rgb),.25);color:var(--red)}
.btn svg{width:15px;height:15px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.inp{width:100%;padding:12px 14px;
  background:var(--glass-bg);backdrop-filter:blur(var(--blur-sm));-webkit-backdrop-filter:blur(var(--blur-sm));
  border:0.5px solid var(--glass-border);border-radius:var(--r2);
  color:var(--t1);font-size:16px;font-family:inherit;outline:none;
  -webkit-appearance:none;appearance:none;
  transition:border-color .18s,box-shadow .18s,background .18s}
.inp:focus{border-color:rgba(var(--accent-rgb),.48);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.1);background:var(--glass-bg2)}
.inp::placeholder{color:var(--t4)}
.inp-lbl{font-size:12px;font-weight:600;color:var(--t3);margin-bottom:5px;letter-spacing:.5px;text-transform:uppercase}
select.inp{cursor:pointer}
select.inp option{background:var(--bg);color:var(--t1)}
textarea.inp{resize:none;min-height:76px;line-height:1.5}

.sec{padding:0 16px;margin-bottom:18px}
.sec-ttl{font-size:12px;font-weight:600;color:var(--t3);margin-bottom:7px;letter-spacing:.5px;text-transform:uppercase;padding-left:2px}
.list{border-radius:var(--r);overflow:hidden;
  background:var(--glass-bg);backdrop-filter:blur(var(--blur-md)) saturate(var(--sat));-webkit-backdrop-filter:blur(var(--blur-md)) saturate(var(--sat));
  border:0.5px solid var(--glass-border);box-shadow:var(--glass-shadow-sm)}
.lr{display:flex;align-items:center;gap:11px;padding:12px 14px;
  border-bottom:0.5px solid var(--glass-border);cursor:pointer;transition:background .12s;min-height:48px}
.lr:last-child{border-bottom:none}
.lr:active{background:var(--glass-bg2)}
.lr-lbl{flex:1;font-size:15px;color:var(--t1)}
.lr-val{font-size:13px;color:var(--t2);flex-shrink:0}
.lr-chev svg{width:15px;height:15px;stroke:var(--t3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.set-group{margin:0 16px 6px;border-radius:var(--r);overflow:hidden;
  background:var(--glass-bg);backdrop-filter:blur(var(--blur-md)) saturate(var(--sat));-webkit-backdrop-filter:blur(var(--blur-md)) saturate(var(--sat));
  border:0.5px solid var(--glass-border);box-shadow:var(--glass-shadow-sm)}
.set-row{display:flex;align-items:center;gap:12px;padding:12px 14px;
  border-bottom:0.5px solid var(--glass-border);cursor:pointer;transition:background .12s;min-height:50px}
.set-row:last-child{border-bottom:none}
.set-row:active{background:var(--glass-bg2)}
.set-icon{width:30px;height:30px;border-radius:8px;background:var(--glass-bg2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.set-icon svg{width:15px;height:15px;stroke:var(--t2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.set-lbl{flex:1;font-size:15px;color:var(--t1)}
.set-val{font-size:13px;color:var(--t3);flex-shrink:0;max-width:160px;text-align:right}
.set-chev svg{width:14px;height:14px;stroke:var(--t3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.set-ttl{font-size:12px;font-weight:600;color:var(--t3);padding:14px 18px 5px;letter-spacing:.3px}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:6px 14px;background:var(--glass-bg);border:0.5px solid var(--glass-border);
  border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;color:var(--t2);
  transition:all .16s var(--sp);will-change:transform}
.chip.on{background:var(--t1);color:var(--bg);border-color:transparent;box-shadow:0 2px 10px rgba(var(--sf-r),var(--sf-g),var(--sf-b),.18)}
.chip:active{transform:scale(0.88)}

.ov{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.5);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;align-items:flex-end;justify-content:center;
  animation:ovIn .2s ease both}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:560px;
  background:var(--sheet-bg);
  backdrop-filter:blur(var(--blur-lg)) saturate(200%);-webkit-backdrop-filter:blur(var(--blur-lg)) saturate(200%);
  border:0.5px solid var(--glass-border2);border-bottom:none;
  border-radius:var(--r) var(--r) 0 0;
  padding:16px 16px calc(var(--sab)+20px);
  max-height:94dvh;overflow-y:auto;
  animation:shUp .36s var(--sp) both;
  box-shadow:0 -6px 48px rgba(0,0,0,.32),inset 0 0.5px 0 var(--glass-border2)}
.sheet::-webkit-scrollbar{display:none}
@keyframes shUp{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
.sh{width:34px;height:4px;background:var(--glass-bg3);border-radius:2px;margin:0 auto 18px}
.sheet-title{font-size:20px;font-weight:700;letter-spacing:-.4px;color:var(--t1);margin-bottom:14px}

.toggle{position:relative;width:50px;height:30px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.tsl{position:absolute;inset:0;background:rgba(var(--sf-r),var(--sf-g),var(--sf-b),.16);
  border-radius:30px;cursor:pointer;transition:background .25s var(--sp);border:0.5px solid var(--glass-border)}
.tsl::before{content:'';position:absolute;left:2px;top:2px;width:26px;height:26px;border-radius:50%;
  background:rgba(var(--sf-r),var(--sf-g),var(--sf-b),.75);
  box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .25s var(--sp)}
input:checked+.tsl{background:var(--accent)}
input:checked+.tsl::before{transform:translateX(20px);background:var(--bg)}

.ob{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(var(--sai)+36px) 30px calc(var(--sab)+56px)}
.ob-logo{width:96px;height:96px;border-radius:26px;
  background:var(--glass-bg2);border:0.5px solid var(--glass-border2);
  backdrop-filter:blur(var(--blur-md));-webkit-backdrop-filter:blur(var(--blur-md));
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--glass-shadow);margin-bottom:22px;
  animation:obFloat 4s ease-in-out infinite}
@keyframes obFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.ob-logo svg{width:50px;height:50px;stroke:var(--t1);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ob-brand{font-size:38px;font-weight:700;letter-spacing:-1px;margin-bottom:7px;color:var(--t1)}
.ob-sub{font-size:15px;color:var(--t2);margin-bottom:36px;text-align:center;line-height:1.6}
.ob-form{width:100%;display:flex;flex-direction:column;gap:11px}
.code-inp{width:100%;padding:17px;text-align:center;font-size:28px;font-weight:700;
  letter-spacing:9px;text-transform:uppercase;
  background:var(--glass-bg);backdrop-filter:blur(var(--blur-sm));-webkit-backdrop-filter:blur(var(--blur-sm));
  border:0.5px solid var(--glass-border);border-radius:var(--r);color:var(--t1);
  font-family:inherit;outline:none;-webkit-appearance:none;appearance:none;transition:border-color .18s,box-shadow .18s}
.code-inp:focus{border-color:rgba(var(--accent-rgb),.48);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.1)}
.ob-div{display:flex;align-items:center;gap:11px;color:var(--t4);font-size:13px;margin:2px 0}
.ob-div::before,.ob-div::after{content:'';flex:1;height:0.5px;background:var(--glass-border)}

.hero-card{margin:0 16px 12px;border-radius:var(--r);
  background:var(--glass-bg);
  backdrop-filter:blur(var(--blur-md)) saturate(var(--sat)) brightness(var(--bri));
  -webkit-backdrop-filter:blur(var(--blur-md)) saturate(var(--sat)) brightness(var(--bri));
  border:0.5px solid var(--glass-border);box-shadow:var(--glass-shadow);padding:16px;overflow:hidden;position:relative}
.hero-card::before{content:'';position:absolute;inset:0;border-radius:inherit;background:var(--glass-inner);pointer-events:none}
.hero-inner{position:relative;z-index:1}
.hero-day{font-size:13px;font-weight:600;color:var(--t2);margin-bottom:3px;letter-spacing:.2px}
.hero-title{font-size:22px;font-weight:700;letter-spacing:-.4px;margin-bottom:9px;color:var(--t1);line-height:1.25}
.hero-prog{height:2px;background:var(--glass-bg3);border-radius:2px;overflow:hidden;margin-bottom:12px}
.hero-fill{height:100%;background:var(--accent);border-radius:2px;transition:width 1.2s var(--ease)}
.hero-members{display:flex;align-items:center;gap:9px}
.hav{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:#fff;border:1.5px solid rgba(0,0,0,.2);
  margin-left:-5px;flex-shrink:0;overflow:hidden}
.hav:first-child{margin-left:0}
.hav img{width:100%;height:100%;object-fit:cover}
.hero-share-btn{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--t1);
  background:var(--glass-bg2);border:0.5px solid var(--glass-border);padding:5px 11px;border-radius:20px;
  cursor:pointer;flex-shrink:0;transition:all .16s var(--sp)}
.hero-share-btn:active{background:var(--glass-bg3);transform:scale(0.92)}
.hero-share-btn svg{width:12px;height:12px;stroke:var(--t1);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.wx-mini{margin:0 16px 12px;border-radius:var(--r2);
  background:var(--glass-bg);backdrop-filter:blur(var(--blur-md)) saturate(var(--sat));-webkit-backdrop-filter:blur(var(--blur-md)) saturate(var(--sat));
  border:0.5px solid var(--glass-border);box-shadow:var(--glass-shadow-sm);
  cursor:pointer;transition:all .16s var(--sp);overflow:hidden}
.wx-mini:active{transform:scale(0.98)}
.wx-mini-row{display:flex;align-items:center;gap:11px;padding:11px 13px}
.wx-mini-temp{font-size:21px;font-weight:700;color:var(--t1);line-height:1}
.wx-mini-loc{font-size:11px;color:var(--t2);font-weight:600;margin-bottom:1px}
.wx-mini-desc{font-size:11px;color:var(--t3)}
.wx-mini-forecast{display:flex;gap:1px;padding:0 13px 9px;border-top:0.5px solid var(--glass-border);padding-top:7px}
.wx-mini-day{flex:1;text-align:center}
.wx-mini-day-lbl{font-size:9px;color:var(--t3);margin-bottom:2px;font-weight:600;text-transform:uppercase}
.wx-mini-day-temp{font-size:11px;color:var(--t2);font-weight:500}
.wx-clothes{display:flex;flex-wrap:wrap;gap:5px;padding:0 13px 9px}
.wx-pill{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--t2);
  background:var(--glass-bg2);border-radius:8px;padding:3px 8px}
.wx-pill svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}

.wx-full{position:fixed;inset:0;z-index:600;
  background:var(--bg);
  backdrop-filter:blur(var(--blur-lg));-webkit-backdrop-filter:blur(var(--blur-lg));
  display:flex;flex-direction:column;overflow:hidden;
  animation:ovIn .22s ease both}
.wx-full-hero{padding:calc(var(--sai)+48px) 20px 20px;
  display:flex;flex-direction:column;align-items:center;text-align:center;flex-shrink:0}
.wx-full-loc{font-size:16px;font-weight:600;color:var(--t1);margin-bottom:2px}
.wx-full-region{font-size:13px;color:var(--t2);margin-bottom:10px}
.wx-full-temp{font-size:72px;font-weight:200;letter-spacing:-3px;color:var(--t1);line-height:1}
.wx-full-desc{font-size:16px;color:var(--t2);margin-top:5px}
.wx-full-hilo{font-size:14px;color:var(--t3);margin-top:3px}
.wx-full-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px calc(var(--sab)+20px)}
.wx-full-scroll::-webkit-scrollbar{display:none}
.wx-section{background:var(--glass-bg);backdrop-filter:blur(var(--blur-sm));-webkit-backdrop-filter:blur(var(--blur-sm));
  border:0.5px solid var(--glass-border);border-radius:var(--r2);margin-bottom:10px;overflow:hidden}
.wx-section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);padding:9px 14px 4px}
.wx-hourly-row{display:flex;gap:0;overflow-x:auto;padding:6px 10px 12px}
.wx-hourly-row::-webkit-scrollbar{display:none}
.wx-hour{flex-shrink:0;width:56px;text-align:center;padding:4px 2px}
.wx-hour-time{font-size:10px;color:var(--t3);margin-bottom:5px;font-weight:500}
.wx-hour-temp{font-size:14px;font-weight:600;color:var(--t1);margin-top:4px}
.wx-hour-prec{font-size:9px;color:#60A0FF;margin-top:2px}
.wx-daily-row{padding:0 2px}
.wx-day-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:0.5px solid var(--glass-border)}
.wx-day-row:last-child{border-bottom:none}
.wx-day-name{font-size:14px;color:var(--t1);width:52px;font-weight:500}
.wx-day-prec{font-size:11px;color:#60A0FF;width:34px;text-align:center;font-weight:600}
.wx-day-range{flex:1;position:relative;height:4px;background:var(--glass-bg3);border-radius:2px;overflow:hidden}
.wx-day-fill{position:absolute;height:100%;border-radius:2px;background:linear-gradient(90deg,#0A84FF,#FF9F0A)}
.wx-day-temps{display:flex;gap:6px;font-size:13px;width:72px;justify-content:flex-end}
.wx-day-min{color:var(--t3)}
.wx-day-max{color:var(--t1);font-weight:600}

.rate-bar{margin:0 16px 12px;padding:10px 13px;border-radius:var(--r2);
  background:var(--glass-bg);border:0.5px solid var(--glass-border);box-shadow:var(--glass-shadow-sm);
  display:flex;align-items:center;gap:9px;cursor:pointer;transition:all .16s var(--sp)}
.rate-bar:active{transform:scale(0.98)}

.qa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;
  background:var(--glass-bg);border:0.5px solid var(--glass-border);
  border-radius:var(--r2);box-shadow:var(--glass-shadow-sm);
  cursor:pointer;transition:all .18s var(--sp);will-change:transform;
  backdrop-filter:blur(var(--blur-sm));-webkit-backdrop-filter:blur(var(--blur-sm))}
.qa:active{transform:scale(0.82) translateY(2px);background:var(--glass-bg2)}
.qa-icon{width:38px;height:38px;border-radius:11px;background:var(--glass-bg2);border:0.5px solid var(--glass-border);
  display:flex;align-items:center;justify-content:center;overflow:hidden;transition:all .18s var(--sp)}
.qa-icon svg{width:19px;height:19px;stroke:var(--t1);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.qa-icon img{width:100%;height:100%;object-fit:cover}
.qa-lbl{font-size:10px;font-weight:500;color:var(--t2);text-align:center;line-height:1.3}

.travel-docs-widget{margin:0 16px 12px;border-radius:var(--r2);
  background:var(--glass-bg);border:0.5px solid var(--glass-border);box-shadow:var(--glass-shadow-sm);overflow:hidden;
  backdrop-filter:blur(var(--blur-md)) saturate(var(--sat));-webkit-backdrop-filter:blur(var(--blur-md)) saturate(var(--sat))}
.tdw-header{display:flex;align-items:center;gap:9px;padding:11px 13px;cursor:pointer;
  border-bottom:0.5px solid var(--glass-border);transition:background .12s}
.tdw-header:active{background:var(--glass-bg2)}
.tdw-doc{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;
  border-bottom:0.5px solid var(--glass-border);cursor:pointer;transition:background .12s}
.tdw-doc:last-child{border-bottom:none}
.tdw-doc:active{background:var(--glass-bg2)}
.tdw-doc-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tdw-doc-icon svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tdw-doc-title{font-size:14px;font-weight:600;color:var(--t1);margin-bottom:2px}
.tdw-doc-sub{font-size:11px;color:var(--t2);line-height:1.4}
.tdw-member-tag{font-size:10px;font-weight:600;padding:1px 6px;border-radius:5px;color:#fff;margin-top:3px;display:inline-block}

.journal-widget{margin:0 16px 12px;border-radius:var(--r2);
  background:var(--glass-bg);border:0.5px solid var(--glass-border);box-shadow:var(--glass-shadow-sm);overflow:hidden;
  cursor:pointer;transition:all .16s var(--sp)}
.journal-widget:active{transform:scale(0.98)}
.journal-header{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:0.5px solid var(--glass-border)}
.journal-preview{padding:11px 13px}

.pbw-scroll{display:flex;gap:9px;overflow-x:auto;padding-bottom:3px;scroll-snap-type:x mandatory}
.pbw-scroll::-webkit-scrollbar{display:none}
.pbw-photo{flex-shrink:0;width:96px;height:96px;border-radius:var(--r2);overflow:hidden;
  background:var(--glass-bg2);border:0.5px solid var(--glass-border);
  scroll-snap-align:start;cursor:pointer;transition:all .18s var(--sp);position:relative}
.pbw-photo:active{transform:scale(0.9)}
.pbw-photo img{width:100%;height:100%;object-fit:cover}
.pbw-add{flex-shrink:0;width:96px;height:96px;border-radius:var(--r2);
  background:var(--glass-bg);border:1px dashed var(--glass-border2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  cursor:pointer;transition:all .18s var(--sp)}
.pbw-add:active{transform:scale(0.9);background:var(--glass-bg2)}
.pbw-photo-cat{position:absolute;bottom:0;left:0;right:0;padding:3px 5px;
  background:linear-gradient(transparent,rgba(0,0,0,.55));font-size:9px;color:rgba(255,255,255,.85)}

.smart-strip{display:flex;gap:9px;overflow-x:auto;padding:0 16px 3px}
.smart-strip::-webkit-scrollbar{display:none}
.smart-pill{flex-shrink:0;background:var(--glass-bg);border:0.5px solid var(--glass-border);
  box-shadow:var(--glass-shadow-sm);border-radius:var(--r2);padding:11px 13px;
  cursor:pointer;transition:all .18s var(--sp);max-width:190px}
.smart-pill:active{transform:scale(0.93)}
.smart-tag{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--t3);margin-bottom:3px}
.smart-ttl{font-size:13px;font-weight:600;margin-bottom:2px;color:var(--t1)}
.smart-desc{font-size:11px;color:var(--t2);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.day-tabs{display:flex;gap:5px;overflow-x:auto;padding:0 16px 10px;flex-shrink:0;scroll-snap-type:x mandatory}
.day-tabs::-webkit-scrollbar{display:none}
.dtab{flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:7px 11px;
  border-radius:var(--r2);background:var(--glass-bg);border:0.5px solid var(--glass-border);
  cursor:pointer;transition:all .2s var(--sp);scroll-snap-align:start;box-shadow:var(--glass-shadow-sm);will-change:transform}
.dtab.on{background:var(--t1);border-color:transparent;box-shadow:0 3px 16px rgba(var(--sf-r),var(--sf-g),var(--sf-b),.22)}
.dtab:active{transform:scale(0.86)}
.dtab-wd{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3)}
.dtab-d{font-size:19px;font-weight:800;color:var(--t1);line-height:1.1}
.dtab.on .dtab-wd{color:rgba(0,0,0,.45)}
.dtab.on .dtab-d{color:var(--bg)}
.dtab.today .dtab-d{color:var(--blue)}
.dtab.on.today .dtab-d{color:var(--blue)}
.itin-scroll{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.itin-scroll::-webkit-scrollbar{display:none}
.itin-page{flex:0 0 100%;scroll-snap-align:start;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--tabh)+48px)}
.itin-page::-webkit-scrollbar{display:none}
.day-hdr{padding:6px 16px 8px;display:flex;align-items:center;gap:7px}
.day-hdr-title{font-size:17px;font-weight:700;flex:1;cursor:pointer;color:var(--t1);transition:opacity .12s}
.day-hdr-title:active{opacity:.6}
.day-hdr-sub{font-size:11px;color:var(--t3);flex-shrink:0}
.day-reorder{display:flex;gap:4px}
.day-reorder-btn{width:26px;height:26px;border-radius:8px;background:var(--glass-bg);border:0.5px solid var(--glass-border);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .14s var(--sp)}
.day-reorder-btn:active{background:var(--glass-bg2);transform:scale(0.86)}
.day-reorder-btn svg{width:11px;height:11px;stroke:var(--t2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act{margin:0 16px 9px;border-radius:var(--r2);
  background:var(--glass-bg);border:0.5px solid var(--glass-border);box-shadow:var(--glass-shadow-sm);overflow:hidden;
  backdrop-filter:blur(var(--blur-sm)) saturate(180%);-webkit-backdrop-filter:blur(var(--blur-sm)) saturate(180%);
  transition:all .18s var(--sp);will-change:transform}
.act:active{transform:scale(0.984)}
.act.urgent{border-left:2px solid var(--red)}
.act-row{display:flex;gap:9px;padding:11px;cursor:pointer}
.act-tc{width:42px;flex-shrink:0;padding-top:2px}
.act-time{font-size:11px;font-weight:700;color:var(--t2);letter-spacing:-.1px}
.act-body{flex:1;min-width:0}
.act-title{font-size:14px;font-weight:600;margin-bottom:4px;line-height:1.4;color:var(--t1)}
.act-meta{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:3px}
.act-chip{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--t2);
  background:var(--glass-bg2);padding:2px 6px;border-radius:5px}
.act-chip svg{width:9px;height:9px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.act-spend{font-size:12px;font-weight:700;color:var(--orange);margin-top:2px}
.act-note{margin-top:5px;padding:6px 9px;border-radius:0 5px 5px 0;border-left:2px solid rgba(var(--orange-rgb),.5);
  background:rgba(var(--orange-rgb),.06);font-size:11px;color:var(--t2);line-height:1.5}
.act-note.urg{border-left-color:rgba(var(--red-rgb),.5);background:rgba(var(--red-rgb),.06);color:rgba(255,110,100,.9)}
.act-apps{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.act-app{display:flex;align-items:center;gap:4px;padding:4px 9px;
  background:var(--glass-bg2);border:0.5px solid var(--glass-border);border-radius:7px;
  font-size:11px;color:var(--t2);cursor:pointer;transition:all .14s var(--sp)}
.act-app:active{transform:scale(0.87);background:var(--glass-bg3);color:var(--t1)}
.act-app svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.act-edit{padding:7px 11px;border-top:0.5px solid var(--glass-border);
  display:flex;align-items:center;justify-content:center;gap:5px;
  font-size:12px;color:var(--t3);cursor:pointer;transition:all .12s}
.act-edit:active{background:var(--glass-bg);color:var(--t1)}
.act-edit svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}

.exp-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-bottom:12px;
  border-radius:var(--r2);overflow:hidden;background:var(--glass-bg);border:0.5px solid var(--glass-border);box-shadow:var(--glass-shadow-sm)}
.estat{background:var(--glass-bg);padding:13px 7px;text-align:center}
.estat-lbl{font-size:10px;color:var(--t3);font-weight:500;margin-bottom:3px}
.estat-val{font-size:19px;font-weight:800;color:var(--t1)}
.ei{display:flex;align-items:center;gap:11px;padding:11px 13px;
  border-bottom:0.5px solid var(--glass-border);cursor:pointer;transition:background .12s}
.ei:last-child{border-bottom:none}
.ei:active{background:var(--glass-bg2)}
.ei-ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ei-ic svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ei-d{flex:1;min-width:0}
.ei-name{font-size:14px;font-weight:600;color:var(--t1)}
.ei-sub{font-size:11px;color:var(--t2);margin-top:1px}
.ei-amt{font-size:15px;font-weight:700}

.ptabs{display:flex;gap:0;padding:4px;background:var(--glass-bg2);border-radius:var(--r2);border:0.5px solid var(--glass-border)}
.ptab{flex:1;padding:8px;border-radius:var(--r3);font-size:14px;font-weight:500;text-align:center;
  cursor:pointer;color:var(--t2);transition:all .22s var(--sp);position:relative;z-index:1}
.ptab.on{background:var(--t1);color:var(--bg);box-shadow:0 2px 10px rgba(var(--sf-r),var(--sf-g),var(--sf-b),.12)}
.ptab:active{transform:scale(0.94)}

.srow{display:flex;align-items:flex-start;padding:11px 13px;border-bottom:0.5px solid var(--glass-border);gap:9px;flex-direction:column}
.srow:last-child{border-bottom:none}
.srow-main{display:flex;align-items:center;width:100%;gap:9px}
.srow-name{font-size:15px;font-weight:600;color:var(--t1)}
.srow-to{font-size:11px;color:var(--t2)}
.srow-amt{font-size:15px;font-weight:700;color:var(--green)}
.pay-btns{display:flex;flex-wrap:wrap;gap:5px;width:100%}
.pay-btn{display:flex;align-items:center;gap:4px;padding:5px 10px;
  background:var(--glass-bg2);border:0.5px solid var(--glass-border);border-radius:7px;
  font-size:11px;color:var(--t2);cursor:pointer;transition:all .14s var(--sp)}
.pay-btn:active{transform:scale(0.88);background:var(--glass-bg3);color:var(--t1)}
.pay-btn svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.srow-done{padding:5px 10px;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;
  background:rgba(var(--green-rgb),.1);border:0.5px solid rgba(var(--green-rgb),.24);color:var(--green);
  transition:all .14s var(--sp);flex-shrink:0}
.srow-done.paid{background:rgba(var(--green-rgb),.2);opacity:.7}
.srow-done:active{transform:scale(0.88)}

.exp-stats-wrap{padding:4px 0}
.stat-donut-row{display:flex;align-items:center;gap:16px;padding:14px;margin-bottom:2px}
.stat-legend{flex:1;display:flex;flex-direction:column;gap:6px}
.stat-legend-item{display:flex;align-items:center;gap:7px}
.stat-legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.stat-legend-lbl{font-size:12px;color:var(--t2);flex:1}
.stat-legend-pct{font-size:12px;font-weight:700;color:var(--t1)}
.stat-daily-bar-wrap{padding:12px 14px}
.stat-daily-bar{display:flex;align-items:flex-end;gap:4px;height:60px;margin-top:8px}
.stat-bar-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.stat-bar-fill{width:100%;background:var(--accent);border-radius:3px 3px 0 0;transition:height .6s var(--sp);min-height:2px}
.stat-bar-lbl{font-size:9px;color:var(--t3);white-space:nowrap}
.stat-bar-amt{font-size:9px;color:var(--t2);white-space:nowrap}
.budget-row{padding:11px 13px;border-top:0.5px solid var(--glass-border)}
.budget-prog{height:5px;background:var(--glass-bg3);border-radius:3px;overflow:hidden;margin:6px 0}
.budget-fill{height:100%;border-radius:3px;transition:width .8s var(--sp)}
.budget-praise{padding:8px 11px;border-radius:var(--r3);font-size:12px;line-height:1.5;margin-top:6px}

.cat-main-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.cat-main-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;
  border-radius:var(--r3);background:var(--glass-bg);border:0.5px solid var(--glass-border);
  cursor:pointer;transition:all .16s var(--sp)}
.cat-main-item.on{border:1.5px solid var(--accent)}
.cat-main-item:active{transform:scale(0.86)}
.cat-main-item svg{width:18px;height:18px;stroke:var(--t2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cat-main-item.on svg{stroke:var(--t1)}
.cat-main-lbl{font-size:9px;color:var(--t2);font-weight:500;text-align:center;line-height:1.2}
.cat-sub-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;min-height:28px;transition:all .2s}
.cat-sub-chip{padding:5px 12px;background:var(--glass-bg);border:0.5px solid var(--glass-border);
  border-radius:16px;font-size:12px;color:var(--t2);cursor:pointer;transition:all .15s var(--sp)}
.cat-sub-chip.on{background:var(--glass-bg3);color:var(--t1);border-color:var(--glass-border2)}
.cat-sub-chip:active{transform:scale(0.88)}

.split-grid{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.split-row{display:flex;align-items:center;gap:8px;padding:7px 11px;
  background:var(--glass-bg);border:0.5px solid var(--glass-border);border-radius:var(--r3)}
.split-check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--glass-border2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .18s var(--sp)}
.split-check.on{background:var(--green);border-color:var(--green)}
.split-check svg{opacity:0;transition:opacity .15s}
.split-check.on svg{opacity:1}
.split-name{flex:1;font-size:14px;color:var(--t1)}
.split-inp{width:72px;padding:5px 9px;background:var(--glass-bg2);border:0.5px solid var(--glass-border);
  border-radius:8px;color:var(--t1);font-size:14px;font-weight:600;text-align:right;
  font-family:inherit;outline:none;-webkit-appearance:none;transition:border-color .15s}
.split-inp:focus{border-color:rgba(var(--accent-rgb),.4)}

.list-item{display:flex;align-items:center;gap:9px;padding:10px 13px;
  border-bottom:0.5px solid var(--glass-border);transition:background .12s}
.list-item:last-child{border-bottom:none}
.list-item.done .list-item-text{text-decoration:line-through;color:var(--t3)}
.list-check{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--glass-border2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .18s var(--sp)}
.list-check.checked{background:var(--green);border-color:var(--green)}
.list-check svg{width:11px;height:11px;opacity:0;transition:opacity .14s}
.list-check.checked svg{opacity:1}
.list-check svg path{stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.list-item-text{flex:1;font-size:14px;color:var(--t1)}
.list-item-del{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--t4);flex-shrink:0;transition:all .13s}
.list-item-del:active{color:var(--red);background:rgba(var(--red-rgb),.1)}
.list-item-del svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* CHAT — KEY FIX */
.chat-outer{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.chat-body{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 8px;
  display:flex;flex-direction:column;gap:9px;-webkit-overflow-scrolling:touch}
.chat-body::-webkit-scrollbar{display:none}
.msg{max-width:82%;animation:msgIn .28s var(--sp) both;will-change:opacity,transform}
@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(0.94)}to{opacity:1;transform:none}}
.msg-u{align-self:flex-end}
.msg-a{align-self:flex-start}
.mbubble{padding:10px 13px;border-radius:17px;font-size:15px;line-height:1.55;word-break:break-word}
.msg-u .mbubble{background:var(--t1);color:var(--bg);border-bottom-right-radius:4px}
.msg-a .mbubble{background:var(--glass-bg2);backdrop-filter:blur(var(--blur-sm));-webkit-backdrop-filter:blur(var(--blur-sm));
  border:0.5px solid var(--glass-border);color:var(--t1);border-bottom-left-radius:4px}
.mmeta{font-size:10px;color:var(--t4);margin-top:3px;padding:0 4px}
.msg-u .mmeta{text-align:right}
.typing-wrap{align-self:flex-start}
.typing-bub{background:var(--glass-bg2);backdrop-filter:blur(var(--blur-sm));-webkit-backdrop-filter:blur(var(--blur-sm));
  border:0.5px solid var(--glass-border);border-radius:17px;border-bottom-left-radius:4px;
  padding:13px 15px;display:flex;gap:4px}
.tdot{width:6px;height:6px;border-radius:50%;background:var(--t2);animation:tdAnim 1s ease infinite}
.tdot:nth-child(2){animation-delay:.16s}
.tdot:nth-child(3){animation-delay:.32s}
