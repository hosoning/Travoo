<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Travoo">
  <meta id="theme-color-meta" name="theme-color" content="#000000">
  <title>Travoo</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    /* ── RESET ─────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0; padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── CSS VARIABLES ────────────────────────────────── */
    :root {
      --sai: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);

      --bg: #111318;
      --t1: rgba(255,255,255,0.96);
      --t2: rgba(255,255,255,0.62);
      --t3: rgba(255,255,255,0.36);
      --t4: rgba(255,255,255,0.20);

      --glass-bg:    rgba(255,255,255,0.06);
      --glass-bg2:   rgba(255,255,255,0.10);
      --glass-bg3:   rgba(255,255,255,0.04);
      --glass-border:  rgba(255,255,255,0.11);
      --glass-border2: rgba(255,255,255,0.22);

      --accent:     #ffffff;
      --accent-rgb: 255,255,255;

      --red:    #FF453A; --red-rgb:    255,69,58;
      --orange: #FF9F0A; --orange-rgb: 255,159,10;
      --green:  #30D158; --green-rgb:  48,209,88;
      --blue:   #0A84FF; --blue-rgb:   10,132,255;
      --purple: #BF5AF2; --purple-rgb: 191,90,242;

      --r1: 10px;
      --r2: 16px;
      --r3: 24px;
      --sp: cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── LIGHT MODE ───────────────────────────────────── */
    [data-color-mode="light"] {
      --bg: #f2f2f7;
      --t1: #1c1c1e;
      --t2: rgba(28,28,30,0.62);
      --t3: rgba(28,28,30,0.38);
      --t4: rgba(28,28,30,0.20);
      --glass-bg:    rgba(255,255,255,0.72);
      --glass-bg2:   rgba(255,255,255,0.88);
      --glass-bg3:   rgba(0,0,0,0.04);
      --glass-border:  rgba(0,0,0,0.10);
      --glass-border2: rgba(0,0,0,0.20);
    }
    [data-color-mode="light"][data-theme-light="warm"] { --bg: #f5f0e8; }
    [data-color-mode="light"][data-theme-light="sky"]  { --bg: #e8f0f5; }
    [data-color-mode="light"][data-theme-light="mint"] { --bg: #e8f5ec; }

    @media (prefers-color-scheme: light) {
      [data-color-mode="auto"] {
        --bg: #f2f2f7;
        --t1: #1c1c1e;
        --t2: rgba(28,28,30,0.62);
        --t3: rgba(28,28,30,0.38);
        --t4: rgba(28,28,30,0.20);
        --glass-bg:    rgba(255,255,255,0.72);
        --glass-bg2:   rgba(255,255,255,0.88);
        --glass-bg3:   rgba(0,0,0,0.04);
        --glass-border:  rgba(0,0,0,0.10);
        --glass-border2: rgba(0,0,0,0.20);
      }
    }

    /* ── BASE LAYOUT ──────────────────────────────────── */
    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: -apple-system, 'SF Pro Text', BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
      color: var(--t1);
    }

    /* Wallpaper layer */
    #wp {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-size: cover;
      background-position: center;
      pointer-events: none;
      display: none;
    }
    #wp.img { display: block !important; }
    #wp.img::after {
      content: '';
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.25);
    }

    /* App root */
    #app {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── NAV BAR ──────────────────────────────────────── */
    .nav {
      display: flex;
      align-items: center;
      /* FIX #1: padding-top set inline per view with --sai, base is just sides/bottom */
      padding: 10px 16px 8px;
      flex-shrink: 0;
      gap: 8px;
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 0.5px solid var(--glass-border);
    }
    .nav-title {
      position: absolute;
      left: 50%; transform: translateX(-50%);
      font-size: 16px; font-weight: 700;
      color: var(--t1);
      white-space: nowrap;
      pointer-events: none;
    }
    .nav-large {
      font-size: 26px; font-weight: 800;
      color: var(--t1);
      letter-spacing: -0.5px;
      flex: 1;
    }
    .nbtn {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--glass-bg2);
      border: 0.5px solid var(--glass-border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--t1);
      flex-shrink: 0;
      transition: opacity .12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .nbtn:active { opacity: 0.5; }

    /* ── VIEWS & TAB BAR ──────────────────────────────── */
    /* FIX #1 + #8: views are flex columns; active one grows to fill space */
    .view {
      display: none;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }
    .view.active {
      display: flex;
      flex: 1;
    }

    .tabs {
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 0.5px solid var(--glass-border);
      height: calc(58px + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }
    .tab {
      display: flex; align-items: center; justify-content: center;
      flex: 1; height: 52px;
      cursor: pointer;
      color: var(--t3);
      transition: color .18s ease, opacity .12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .tab.on { color: var(--accent); }
    .tab:active { opacity: 0.6; }
    .tab-center {
      display: flex; align-items: center; justify-content: center;
      width: 54px; height: 54px;
      border-radius: 50%;
      background: rgba(var(--accent-rgb),0.12);
      border: 0.5px solid rgba(var(--accent-rgb),0.22);
      margin: 0 6px;
      cursor: pointer;
      color: var(--t3);
      flex-shrink: 0;
      transition: color .18s ease, background .18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-center.on {
      color: var(--accent);
      background: rgba(var(--accent-rgb),0.18);
    }

    /* Scrollable content area */
    .scroller {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    /* ── ANIMATIONS ───────────────────────────────────── */
    .anim-in  { animation: animIn  .26s var(--sp) forwards; }
    .anim-left  { animation: animLeft  .22s var(--sp) forwards; }
    .anim-right { animation: animRight .22s var(--sp) forwards; }
    @keyframes animIn    { from{opacity:0;transform:translateY(8px)}  to{opacity:1;transform:none} }
    @keyframes animLeft  { from{opacity:0;transform:translateX(24px)} to{opacity:1;transform:none} }
    @keyframes animRight { from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none} }

    .li-anim > * { animation: liIn .22s var(--sp) backwards; }
    .li-anim > *:nth-child(1){animation-delay:0ms}
    .li-anim > *:nth-child(2){animation-delay:30ms}
    .li-anim > *:nth-child(3){animation-delay:60ms}
    .li-anim > *:nth-child(4){animation-delay:90ms}
    .li-anim > *:nth-child(5){animation-delay:120ms}
    @keyframes liIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }

    .shake { animation: shake .36s ease; }
    @keyframes shake {
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-8px)}
      60%{transform:translateX(8px)}
      80%{transform:translateX(-4px)}
    }
    .shimmer {
      background: linear-gradient(90deg, var(--glass-bg), var(--glass-bg2), var(--glass-bg));
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position:  200% 0; }
    }

    /* ── BUTTONS ──────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px;
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 14px; font-weight: 600;
      cursor: pointer;
      border: none; outline: none;
      font-family: inherit;
      transition: transform .12s ease, opacity .12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; }
    .btn-full { width: 100%; }
    .btn-p {
      background: rgba(var(--accent-rgb),0.16);
      color: var(--accent);
      border: 0.5px solid rgba(var(--accent-rgb),0.28);
    }
    .btn-g {
      background: var(--glass-bg2);
      color: var(--t1);
      border: 0.5px solid var(--glass-border);
    }
    .btn-d {
      background: rgba(var(--red-rgb),0.10);
      color: var(--red);
      border: 0.5px solid rgba(var(--red-rgb),0.22);
    }

    /* ── INPUTS ───────────────────────────────────────── */
    .inp {
      width: 100%;
      background: var(--glass-bg2);
      border: 0.5px solid var(--glass-border);
      border-radius: 12px;
      padding: 11px 13px;
      font-size: 15px; color: var(--t1);
      outline: none;
      font-family: inherit;
      appearance: none; -webkit-appearance: none;
      display: block;
      resize: none;
      transition: border-color .15s ease;
    }
    .inp::placeholder { color: var(--t3); }
    .inp:focus { border-color: rgba(var(--accent-rgb),0.5); }
    select.inp { cursor: pointer; }
    textarea.inp { resize: none; -webkit-overflow-scrolling: touch; }
    .inp-lbl {
      font-size: 12px; font-weight: 700;
      color: var(--t3);
      text-transform: uppercase; letter-spacing: 0.4px;
      margin-bottom: 5px;
    }
    .code-inp {
      width: 100%;
      background: var(--glass-bg2);
      border: 0.5px solid var(--glass-border);
      border-radius: 14px;
      padding: 14px 13px;
      font-size: 20px; font-weight: 700; letter-spacing: 5px;
      color: var(--t1); text-align: center;
      font-family: monospace;
      outline: none; display: block;
      margin-bottom: 11px;
    }
    .code-inp:focus { border-color: rgba(var(--accent-rgb),0.5); }
    .code-disp {
      font-size: 26px; font-weight: 800; letter-spacing: 7px;
      font-family: monospace; text-align: center; color: var(--t1);
      background: var(--glass-bg2); border: 0.5px solid var(--glass-border);
      border-radius: 14px; padding: 16px;
    }

    /* ── SECTIONS ─────────────────────────────────────── */
    .sec { margin: 0 16px 16px; }
    .sec-ttl {
      font-size: 12px; font-weight: 700; color: var(--t3);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    /* ── LISTS / LR ROWS ──────────────────────────────── */
    .list {
      background: var(--glass-bg);
      border: 0.5px solid var(--glass-border);
      border-radius: var(--r2); overflow: hidden;
    }
    .lr {
      display: flex; align-items: center;
      padding: 11px 14px; gap: 10px;
      cursor: pointer;
      border-bottom: 0.5px solid var(--glass-border);
      transition: opacity .12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .lr:last-child { border-bottom: none; }
    .lr:active { opacity: 0.65; }
    .lr-lbl { font-size: 14px; color: var(--t2); flex-shrink: 0; }
    .lr-val  { font-size: 14px; color: var(--t1); font-weight: 500; flex: 1; text-align: right; }
    .lr-chev { color: var(--t3); }

    /* ── EMPTY STATES ─────────────────────────────────── */
    .empty {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 20px; color: var(--t3);
    }
    .empty-ttl { font-size: 16px; font-weight: 600; margin-top: 14px; color: var(--t2); }
    .empty-sub { font-size: 13px; color: var(--t3); margin-top: 5px; text-align: center; }

    /* ── ONBOARDING ───────────────────────────────────── */
    .ob {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: calc(var(--sai,0px) + 24px) 28px calc(env(safe-area-inset-bottom,0px) + 36px);
    }
    .ob-logo { color: var(--accent); margin-bottom: 16px; }
    .ob-brand { font-size: 38px; font-weight: 900; letter-spacing: -1px; color: var(--t1); margin-bottom: 6px; }
    .ob-sub   { font-size: 14px; color: var(--t2); margin-bottom: 32px; text-align: center; }
    .ob-form  { width: 100%; max-width: 360px; }
    .ob-form .inp { margin-bottom: 9px; }
    .ob-div {
      text-align: center; color: var(--t3); font-size: 13px;
      margin: 13px 0; position: relative;
    }
    .ob-div::before, .ob-div::after {
      content: ''; position: absolute; top: 50%;
      width: 40%; height: 0.5px; background: var(--glass-border);
    }
    .ob-div::before { left: 0; }
    .ob-div::after  { right: 0; }

    /* ── HERO CARD ────────────────────────────────────── */
    .hero-card {
      margin: 0 16px 12px;
      border-radius: var(--r3);
      background: var(--glass-bg);
      border: 0.5px solid var(--glass-border);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      overflow: hidden;
    }
    .hero-inner { padding: 18px 16px 14px; }
    .hero-day {
      font-size: 11px; font-weight: 700; color: var(--t3);
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;
    }
    .hero-title {
      font-size: 22px; font-weight: 800; color: var(--t1);
      line-height: 1.25; letter-spacing: -0.3px; margin-bottom: 14px;
    }
    .hero-prog {
      height: 3px; background: var(--glass-bg3); border-radius: 2px;
      overflow: hidden; margin-bottom: 13px;
    }
    .hero-fill {
      height: 100%;
      background: linear-gradient(90deg, rgba(var(--accent-rgb),0.45), var(--accent));
      border-radius: 2px;
      transition: width 1.2s var(--sp);
    }
    .hero-members { display: flex; align-items: center; gap: 7px; }
    .hav {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--glass-bg2); border: 1.5px solid var(--bg);
      overflow: hidden; display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: #fff;
      margin-right: -7px; flex-shrink: 0;
    }
    .hav img { width: 100%; height: 100%; object-fit: cover; }
    .hero-share-btn {
      display: flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 8px;
      background: rgba(var(--accent-rgb),0.12);
      border: 0.5px solid rgba(var(--accent-rgb),0.22);
      color: var(--accent); font-size: 11px; font-weight: 600;
      cursor: pointer;
      transition: opacity .15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .hero-share-btn:active { opacity: 0.65; }

    /* ── WEATHER MINI ─────────────────────────────────── */
    .wx-mini {
      background: var(--glass-bg);
      border: 0.5px solid var(--glass-border);
      border-radius: var(--r2);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      overflow: hidden;
    }
    .wx-mini-row { display: flex; align-items: center; gap: 10px; }
    .wx-mini-loc  { font-size: 12px; color: var(--t3); margin-bottom: 1px; }
    .wx-mini-temp { font-size: 30px; font-weight: 200; color: var(--t1); line-height: 1; }
    .wx-mini-desc { font-size: 12px; color: var(--t2); margin-top: 2px; }
    .wx-mini-day  { text-align: center; flex-shrink: 0; min-width: 38px; }
    .wx-mini-day-lbl  { font-size: 10px; color: var(--t3); margin-bottom: 3px; }
    .wx-mini-day-temp { font-size: 13px; font-weight: 700; color: var(--t1); margin-top: 2px; }
    .wx-clothes { display: flex; flex-wrap: wrap; gap: 6px; }
    .wx-pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 9px;
      background: var(--glass-bg2); border: 0.5px solid var(--glass-border);
      border-radius: 8px; font-size: 11px; color: var(--t2);
    }

    /* FIX #4 — Weather full screen (slide-up overlay) */
    .wx-full {
      position: fixed; inset: 0; z-index: 200;
      background: var(--bg);
      overflow: hidden;
    }

    /* ── RATE BAR ─────────────────────────────────────── */
    .rate-bar {
      margin: 0 16px 12px;
      padding: 10px 13px;
      background: var(--glass-bg); border: 0.5px solid var(--glass-border);
      border-radius: var(--r2);
      display: flex; align-items: center; gap: 8px;
    }

    /* ── TRAVEL DOCS WIDGET ───────────────────────────── */
    .travel-docs-widget {
      margin: 0 16px 12px;
      background: var(--glass-bg); border: 0.5px solid var(--glass-border);
      border-radius: var(--r2); overflow: hidden;
    }
    .tdw-header {
      display: flex; align-items: center; gap: 9px;
      padding: 11px 13px;
      border-bottom: 0.5px solid var(--glass-border);
      cursor: pointer;
      transition: opacity .15s ease;
    }
    .tdw-header:active { opacity: 0.7; }
    .tdw-doc {
      display: flex; align-items: flex-start; gap: 9px;
      padding: 10px 13px;
      border-bottom: 0.5px solid var(--glass-border);
      cursor: pointer; transition: opacity .15s ease;
    }
    .tdw-doc:last-child { border-bottom: none; }
    .tdw-doc:active { opacity: 0.7; }
    .tdw-doc-icon {
      width: 32px; height: 32px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .tdw-doc-title {
      font-size: 14px; font-weight: 600; color: var(--t1);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tdw-doc-sub { font-size: 11px; color: var(--t2); margin-top: 2px; }
    .tdw-member-tag {
      display: inline-block; padding: 1px 7px; border-radius: 5px;
      font-size: 10px; font-weight: 700; color: #fff;
    }

    /* ── PHOTO BOARD WIDGET ───────────────────────────── */
    .pbw-scroll {
      display: flex; gap: 8px;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      padding: 4px 0 8px; scrollbar-width: none;
    }
    .pbw-scroll::-webkit-scrollbar { display: none; }
    .pbw-add {
      width: 72px; height: 72px; border-radius: 12px;
      background: var(--glass-bg2);
      border: 0.5px dashed var(--glass-border2);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; cursor: pointer; flex-shrink: 0; color: var(--t3);
      transition: opacity .15s ease;
    }
    .pbw-add:active { opacity: 0.6; }
    .pbw-photo {
      width: 72px; height: 72px; border-radius: 12px;
      background: var(--glass-bg2); overflow: hidden;
      position: relative; flex-shrink: 0; cursor: pointer;
      transition: opacity .15s ease;
    }
    .pbw-photo:active { opacity: 0.75; }
    .pbw-photo img { width: 100%; height: 100%; object-fit: cover; }
    .pbw-photo-cat {
      position: absolute; bottom: 3px; left: 3px; right: 3px;
      font-size: 9px; color: #fff; background: rgba(0,0,0,0.52);
      border-radius: 4px; padding: 1px 4px; text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ── JOURNAL WIDGET ───────────────────────────────── */
    .journal-widget {
      margin: 0 16px 12px;
      background: var(--glass-bg); border: 0.5px solid var(--glass-border);
      border-radius: var(--r2); overflow: hidden;
      cursor: pointer; transition: opacity .15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .journal-widget:active { opacity: 0.8; }
    .journal-header {
      display: flex; align-items: center; gap: 9px;
      padding: 11px 13px;
      border-bottom: 0.5px solid var(--glass-border);
    }
    .journal-preview { padding: 10px 13px 12px; }
    .journal-entry-card {
      background: var(--glass-bg); border: 0.5px solid var(--glass-border);
      border-radius: 13px; margin-bottom: 9px; overflow: hidden;
      cursor: pointer; transition: opacity .15s ease;
    }
    .journal-entry-card:active { opacity: 0.75; }
    .journal-entry-header { display: flex; align-items: center; gap: 9px; padding: 10px 13px 5px; }
    .journal-entry-body { padding: 0 13px 10px; }
    .journal-entry-text {
      font-size: 13px; color: var(--t1); line-height: 1.55;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* ── SMART RECS ───────────────────────────────────── */
    .smart-strip {
      display: flex; gap: 9px;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      padding-bottom: 4px; scrollbar-width: none;
    }
    .smart-strip::-webkit-scrollbar { display: none; }
    .smart-pill {
      background: var(--glass-bg); border: 0.5px solid var(--glass-border);
      border-radius: 14px; padding: 11px 13px;
      min-width: 140px; flex-shrink: 0; cursor: pointer;
      transition: opacity .15s ease;
    }
    .smart-pill:active { opacity: 0.7; }
    .smart-tag { font-size: 10px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .smart-ttl { font-size: 14px; font-weight: 600; color: var(--t1); margin-bottom: 2px; }
    .smart-desc { font-size: 11px; color: var(--t3); }

    /* ── QUICK APPS ───────────────────────────────────── */
    .qa-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }
    .qa {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .qa-icon {
      width: 52px; height: 52px; border-radius: 16px;
      background: var(--glass-bg2); border: 0.5px solid var(--glass-border);
      display: flex; align-items: center; justify-content: center;
      color: var(--t1); overflow: hidden;
    }
    .qa-icon img { width: 100%; height: 100%; object-fit: cover; }
    .qa-lbl { font-size: 11px; color: var(--t2); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 64px; }

    /* ── ITINERARY ────────────────────────────────────── */
    .day-tabs {
      display: flex; gap: 4px;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      padding: 8px 16px 0; scrollbar-width: none;
      flex-shrink: 0;
      background: var(--glass-bg);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-bottom: 0.5px solid var(--glass-border);
    }
    .day-tabs::-webkit-scrollbar { display: none; }
    .dtab {
      display: flex; flex-direction: column; align-items: center;
      padding: 6px 11px 8px; border-radius: 10px 10px 0 0;
      cursor: pointer; flex-shrink: 0; min-width: 44px;
      color: var(--t3);
      transition: background .15s ease, color .15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .dtab.on { background: rgba(var(--accent-rgb),0.11); color: var(--accent); }
    .dtab.today .dtab-d {
      background: var(--accent); color: var(--bg);
      border-radius: 50%; width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
    }
    .dtab-wd { font-size: 10px; font-weight: 600; margin-bottom: 2px; }
    .dtab-d  { font-size: 14px; font-weight: 700; }

    .itin-scroll {
      display: flex; overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      flex: 1;
    }
    .itin-scroll::-webkit-scrollbar { display: none; }
    .itin-page {
      min-width: 100%; width: 100%;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      scroll-snap-align: start;
      padding-bottom: 24px;
    }
    .day-hdr { padding: 14px 16px 10px; display: flex; align-items: flex-start; gap: 8px; }
    .day-hdr-title { font-size: 18px; font-weight: 700; color: var(--t1); flex: 1; cursor: pointer; }
    .day-hdr-sub { font-size: 12px; color: var(--t3); margin-top: 2px; }
    .day-reorder { display: flex; gap: 4px; }
    .day-reorder-btn {
      width: 26px; height: 26px; border-radius: 7px;
      background: var(--glass-bg2); border: 0.5px solid var(--glass-border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--t2);
      transition: opacity .15s ease;
    }
    .day-reorder-btn:active { opacity: 0.5; }

    .act {
      margin: 0 14px 7px;
      background: var(--glass-bg); border: 0.5px solid var(--glass-border);
      border-radius: 14px; overflow: hidden; cursor: pointer;
      transition: opacity .12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .act:active { opacity: 0.75; }
    .act.urgent { border-color: rgba(var(--red-rgb),0.3); background: rgba(var(--red-rgb),0.04); }
    .act-row { display: flex; }
    .act-tc  { padding: 11px 8px 11px 13px; flex-shrink: 0; width: 54px; }
    .act-time { font-size: 11px; font-weight: 700; color: var(--t3); text-align: center; }
    .act-body { padding: 10px 13px 10px 0; flex: 1; min-width: 0; }
    .act-title { font-size: 14px; font-weight: 600; color: var(--t1); line-height: 1.4; }
    .act-meta  { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
    .act-chip {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 2px 7px;
      background: var(--glass-bg2); border: 0.5px solid var(--glass-border);
      border-radius: 6px; font-size: 11px; color: var(--t2);
    }
    .act-spend { font-size: 12px; color: var(--orange); font-weight: 600; margin-top: 4px; }
    .act-note  { font-size: 11px; color: var(--t3); margin-top: 3px; }
    .act-note.urg { color: var(--red); }
    .act-apps { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    .act-app {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 3px 8px;
      background: rgba(var(--blue-rgb),0.10); border: 0.5px solid rgba(var(--blue-rgb),0.20);
      border-radius: 6px; font-size: 11px; color: var(--blue);
      cursor: pointer; transition: opacity .15s ease;
    }
    .act-app:active { opacity: 0.65; }
    .act-edit {
      padding: 6px 13px 8px;
      font-size: 11px; color: var(--t3);
      border-top: 0.5px solid var(--glass-border);
      display: flex; align-items: center; gap: 4px;
      transition: opacity .15s ease;
    }
    .act-edit:active { opacity: 0.5; }

    /* ── EXPENSES ─────────────────────────────────────── */
    .exp-sum {
      display: flex; gap: 10px;
      padding: 13px 14px;
      background: var(--glass-bg); border: 0.5px solid var(--glass-border);
      border-radius: 14px; margin-bottom: 11px;
    }
    .estat { flex: 1; text-align: center; }
    .estat-lbl { font-size: 10px; color: var(--t3); text-transform: uppercase; letter-spacing: 0.4px; }
    .estat-val { font-size: 20px; font-weight: 800; color: var(--t1); margin-top: 2px; }

    /* FIX #5 — Pill tabs with smooth transition */
    .ptabs {
      display: flex;
      background: var(--glass-bg); border: 0.5px solid var(--glass-border);
      border-radius: 12px; padding: 3px; gap: 3px;
    }
    .ptab {
      flex: 1; text-align: center;
      padding: 7px 10px; border-radius: 9px;
      font-size: 13px; font-weight: 600; color: var(--t3);
      cursor: pointer;
      transition: all .22s cubic-bezier(.4,0,.2,1);
      -webkit-tap-highlight-color: transparent;
    }
    .ptab.on {
      background: rgba(var(--accent-rgb),0.15);
      color: var(--accent);
      border: 0.5px solid rgba(var(--accent-rgb),0.24);
    }

    .ei {
      display: flex; align-items: center; gap: 11px;
      padding: 10px 13px;
      border-bottom: 0.5px solid var(--glass-border);
      cursor: pointer;
      transition: opacity .12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .ei:last-child { border-bottom: none; }
    .ei:active { opacity: 0.65; }
    .ei-ic { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .ei-d  { flex: 1; min-width: 0; }
    .ei-name { font-size: 14px; font-weight: 600; color: var(--t1); }
    .ei-sub  { font-size: 11px; color: var(--t3); margin-top: 1px; }
    .ei-amt  { font-size: 16px; font-weight: 700; white-space: nowrap; }

    /* Stats */
    .stat-donut-row { display: flex; align-items: center; gap: 14px; padding: 13px; }
    .stat-legend { flex: 1; }
    .stat-legend-item { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
    .stat-legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .stat-legend-lbl { font-size: 12px; color: var(--t2); flex: 1; }
    .stat-legend-pct { font-size: 11px; color: var(--t3); }
    .stat-daily-bar-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 8px; }
    .stat-daily-bar { display: flex; gap: 8px; padding: 0 13px 4px; min-width: max-content; align-items: flex-end; }
    .stat-bar-col   { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 38px; }
    .stat-bar-amt   { font-size: 9px; color: var(--t3); white-space: nowrap; }
    .stat-bar-fill  { width: 22px; border-radius: 4px 4px 0 0; transition: height .5s var(--sp); }
    .stat-bar-lbl   { font-size: 10px; color: var(--t3); }
    .budget-row { padding: 11px 13px; }
    .budget-prog { height: 6px; background: var(--glass-bg3); border-radius: 3px; overflow: hidden; }
    .budget-fill { height: 100%; border-radius: 3px; transition: width .6s var(--sp); }
    .budget-praise { padding: 7px 10px; border-radius: 9px; font-size: 12px; color: var(--t2); margin-top: 7px; }

    /* Settle */
    .srow { background: var(--glass-bg); border: 0.5px solid var(--glass-border); border-radius: 13px; margin-bottom: 8px; overflow: hidden; }
    .srow-main { display: flex; align-items: center; gap: 9px; padding: 11px 13px; }
    .srow-name { font-size: 14px; font-weight: 600; color: var(--t1); }
    .srow-to   { font-size: 11px; color: var(--t3); margin-top: 1px; }
    .srow-amt  { font-size: 16px; font-weight: 700; color: var(--orange); }
    .srow-done {
      padding: 5px 10px; border-radius: 8px;
      background: var(--glass-bg2); border: 0.5px solid var(--glass-border);
      font-size: 11px; font-weight: 600; color: var(--t2);
      display: flex; align-items: center; gap: 3px;
      cursor: pointer; transition: all .2s ease; white-space: nowrap;
    }
    .srow-done.paid { background: rgba(var(--green-rgb),0.12); color: var(--green); border-color: rgba(var(--green-rgb),0.25); }
    .pay-btns { display: flex; gap: 6px; padding: 0 13px 10px; flex-wrap: wrap; }
    .pay-btn  {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px;
      background: var(--glass-bg2); border: 0.5px solid var(--glass-border);
      border-radius: 7px; font-size: 11px; color: var(--t2);
      cursor: pointer; transition: opacity .15s ease;
    }
    .pay-btn:active { opacity: 0.65; }

    /* Category selector */
    .cat-main-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; margin-bottom: 9px; }
    .cat-main-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 8px 4px; border-radius: 11px;
      background: var(--glass-bg); border: 0.5px solid var(--glass-border);
      cursor: pointer; transition: all .15s var(--sp);
      -webkit-tap-highlight-color: transparent;
    }
    .cat-main-item.on { background: rgba(var(--accent-rgb),0.12); border-color: rgba(var(--accent-rgb),0.28); }
    .cat-main-item:active { opacity: 0.7; }
    .cat-main-lbl { font-size: 10px; color: var(--t2); text-align: center; }
    .cat-sub-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 9px; }
    .cat-sub-chip {
      padding: 5px 11px; border-radius: 9px;
      background: var(--glass-bg); border: 0.5px solid var(--glass-border);
      font-size: 12px; color: var(--t2); cursor: pointer;
      transition: all .15s ease;
    }
    .cat-sub-chip.on { background: rgba(var(--accent-rgb),0.14); color: var(--accent); border-color: rgba(var(--accent-rgb),0.28); }

    /* Split selector */
    .split-grid { display: flex; flex-direction: column; gap: 6px; }
    .split-row { display: flex; align-items: center; gap: 9px; padding: 7px 11px; background: var(--glass-bg); border: 0.5px solid var(--glass-border); border-radius: 11px; }
    .split-check {
      width: 22px; height: 22px; border-radius: 6px;
      background: var(--glass-bg2); border: 1.5px solid var(--glass-border2);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      transition: all .15s ease;
    }
    .split-check.on { background: var(--green); border-color: var(--green); }
    .split-name { font-size: 13px; color: var(--t1); flex: 1; }
    .split-inp {
      width: 72px; background: var(--glass-bg2); border: 0.5px solid var(--glass-border);
      border-radius: 8px; padding: 5px 8px; font-size: 13px; color: var(--t1);
      font-family: inherit; text-align: right; outline: none;
    }

    /* ── CHAT ─────────────────────────────────────────── */
    /* FIX #8: chat layout — body grows, bar stays at bottom always */
    .chat-body {
      flex: 1;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 8px 14px 12px;
    }
    .chat-bar {
      flex-shrink: 0;
      display: flex; align-items: flex-end; gap: 8px;
      padding: 8px 12px calc(env(safe-area-inset-bottom,0px) + 8px);
      background: var(--glass-bg);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 0.5px solid var(--glass-border);
    }
    .chat-inp-el {
      flex: 1;
      background: var(--glass-bg2); border: 0.5px solid var(--glass-border);
      border-radius: 18px; padding: 9px 14px;
      font-size: 15px; color: var(--t1);
      outline: none; font-family: inherit;
      resize: none; max-height: 110px;
      line-height: 1.4; -webkit-overflow-scrolling: touch;
      transition: border-color .15s ease;
    }
    .chat-inp-el::placeholder { color: var(--t3); }
    .chat-inp-el:focus { border-color: rgba(var(--accent-rgb),0.45); }
    .csend {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(var(--accent-rgb),0.18); border: 0.5px solid rgba(var(--accent-rgb),0.3);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--accent); flex-shrink: 0;
      transition: transform .15s ease, opacity .15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .csend:active { transform: scale(0.9); }
    .csend:disabled { opacity: 0.4; }
    .cvbtn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--glass-bg2); border: 0.5px solid var(--glass-border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--t2); flex-shrink: 0;
      transition: opacity .15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .cvbtn:active { opacity: 0.6; }
    .csug-wrap {
      flex-shrink: 0;
      display: flex; gap: 7px;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      padding: 7px 12px 4px; scrollbar-width: none;
    }
    .csug-wrap::-webkit-scrollbar { display: none; }
    .csug {
      padding: 6px 12px;
      background: var(--glass-bg2); border: 0.5px solid var(--glass-border);
      border-radius: 14px; font-size: 12px; color: var(--t2);
      white-space: nowrap; cursor: pointer; flex-shrink: 0;
      transition: opacity .15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .csug:active { opacity: 0.65; }

    .msg { display: flex; flex-direction: column; margin-bottom: 10px; }
    .msg-u { align-items: flex-end; }
    .msg-a { align-items: flex-start; }
    .mbubble {
      max-width: 82%; padding: 9px 13px; border-radius: 16px;
      font-size: 14px; line-height: 1.55;
    }
    .msg-u .mbubble {
      background: rgba(var(--accent-rgb),0.18); color: var(--t1);
      border: 0.5px solid rgba(var(--accent-rgb),0.25);
      border-bottom-right-radius: 4px;
    }
    .msg-a .mbubble {
      background: var(--glass-bg2); color: var(--t1);
      border: 0.5px solid var(--glass-border);
      border-bottom-left-radius: 4px;
    }
    .mmeta { font-size: 10px; color: var(--t3); margin-top: 3px; padding: 0 4px; }
    .typing-wrap { margin-bottom: 10px; }
    .typing-bub {
      display: inline-flex; gap: 4px; align-items: center;
      padding: 9px 13px;
      background: var(--glass-bg2); border: 0.5px solid var(--glass-border);
      border-radius: 16px; border-bottom-left-radius: 4px;
    }
    .tdot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--t3);
      animation: tdot 1.2s ease-in-out infinite;
    }
    .tdot:nth-child(2) { animation-delay: .2s; }
    .tdot:nth-child(3) { animation-delay: .4s; }
    @keyframes tdot {
      0%,80%,100% { transform: scale(1); opacity: .4; }
      40% { transform: scale(1.35); opacity: 1; }
    }

    /* ── SETTINGS ─────────────────────────────────────── */
    .set-ttl {
      font-size: 12px; font-weight: 700; color: var(--t3);
      text-transform: uppercase; letter-spacing: 0.5px;
      padding: 0 16px; margin: 20px 0 6px;
    }
    .set-group {
      background: var(--glass-bg); border: 0.5px solid var(--glass-border);
      border-radius: var(--r2); margin: 0 16px; overflow: hidden;
    }
    .set-row {
      display: flex; align-items: center;
      padding: 12px 14px; gap: 11px;
      cursor: pointer;
      border-bottom: 0.5px solid var(--glass-border);
      transition: opacity .12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .set-row:last-child { border-bottom: none; }
    .set-row:active { opacity: 0.65; }
    .set-icon {
      width: 30px; height: 30px; border-radius: 8px;
      background: rgba(var(--accent-rgb),0.10);
      display: flex; align-items: center; justify-content: center;
      color: var(--accent); flex-shrink: 0;
    }
    .set-lbl  { font-size: 15px; color: var(--t1); flex: 1; }
    .set-val  { font-size: 13px; color: var(--t3); }
    .set-chev { color: var(--t3); }
    .you-tag {
      font-size: 10px; font-weight: 700; color: var(--accent);
      background: rgba(var(--accent-rgb),0.12);
      padding: 2px 7px; border-radius: 5px;
    }
    .member-can-del {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 11px; color: var(--red);
      padding: 3px 7px; border-radius: 7px;
      border: 0.5px solid rgba(var(--red-rgb),0.25);
      cursor: pointer; transition: opacity .15s ease;
    }
    .member-can-del:active { opacity: 0.65; }

    /* Toggle switch */
    .toggle { position: relative; display: inline-block; width: 44px; height: 26px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .tsl {
      position: absolute; inset: 0; cursor: pointer;
      background: var(--glass-bg3); border: 0.5px solid var(--glass-border);
      border-radius: 13px;
      transition: background .2s ease, border-color .2s ease;
    }
    .tsl::before {
      content: ''; position: absolute;
      height: 20px; width: 20px; left: 3px; top: 2px;
      background: rgba(var(--accent-rgb),0.55); border-radius: 50%;
      transition: transform .22s var(--sp), background .2s ease;
    }
    .toggle input:checked + .tsl {
      background: rgba(var(--accent-rgb),0.22);
      border-color: rgba(var(--accent-rgb),0.38);
    }
    .toggle input:checked + .tsl::before {
      transform: translateX(18px);
      background: var(--accent);
    }

    /* ── CHIPS ────────────────────────────────────────── */
    .chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip {
      padding: 6px 14px; border-radius: 10px;
      background: var(--glass-bg2); border: 0.5px solid var(--glass-border);
      font-size: 13px; font-weight: 500; color: var(--t2);
      cursor: pointer;
      transition: all .18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .chip.on {
      background: rgba(var(--accent-rgb),0.15);
      color: var(--accent); border-color: rgba(var(--accent-rgb),0.30);
    }

    /* Theme grid */
    .theme-grid { display: grid; grid-template-columns: repeat(6,1fr); gap: 8px; margin-bottom: 8px; }
    .theme-swatch {
      width: 100%; aspect-ratio: 1; border-radius: 10px;
      cursor: pointer; border: 2px solid transparent;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .theme-swatch.on {
      border-color: var(--accent); transform: scale(1.08);
      box-shadow: 0 0 0 3px rgba(var(--accent-rgb),0.25);
    }

    /* ── OVERLAY / MODAL (SHEET) ──────────────────────── */
    .ov {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.42);
      display: flex; align-items: flex-end;
      animation: ovIn .24s cubic-bezier(.4,0,.2,1) forwards;
    }
    @keyframes ovIn { from{opacity:0} to{opacity:1} }
    .sheet {
      width: 100%;
      background: var(--glass-bg);
      backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
      border: 0.5px solid var(--glass-border);
      border-radius: var(--r3) var(--r3) 0 0;
      /* FIX #2: always has horizontal padding */
      padding: 0 18px calc(env(safe-area-inset-bottom,0px) + 24px);
      max-height: 88dvh;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      animation: sheetUp .28s cubic-bezier(.4,0,.2,1) forwards;
    }
    @keyframes sheetUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
    .sh {
      width: 38px; height: 4px; border-radius: 2px;
      background: var(--glass-border2);
      margin: 10px auto 14px;
    }
    .sheet-title { font-size: 19px; font-weight: 700; color: var(--t1); margin-bottom: 14px; }

    .load-ov {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,0.28);
      display: flex; align-items: center; justify-content: center;
    }
    .spin {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid rgba(var(--accent-rgb),0.18);
      border-top-color: var(--accent);
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to{transform:rotate(360deg)} }

    .toast-el {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom,0px) + 82px);
      left: 50%; transform: translateX(-50%);
      z-index: 400;
      background: rgba(22,22,26,0.90);
      color: rgba(255,255,255,0.95);
      padding: 9px 20px; border-radius: 22px;
      font-size: 13px; font-weight: 600;
      white-space: nowrap; max-width: 88vw; text-align: center;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      transition: opacity .28s ease;
    }
    [data-color-mode="light"] .toast-el { background: rgba(28,28,30,0.90); }

    /* ── LISTS (check items) ──────────────────────────── */
    .list-item {
      display: flex; align-items: center; gap: 9px;
      padding: 9px 13px;
      border-bottom: 0.5px solid var(--glass-border);
      transition: opacity .15s ease;
    }
    .list-item:last-child { border-bottom: none; }
    .list-item.done .list-item-text { text-decoration: line-through; opacity: 0.42; }
    .list-check {
      width: 22px; height: 22px; border-radius: 6px;
      background: var(--glass-bg2); border: 1.5px solid var(--glass-border2);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      transition: all .18s ease;
    }
    .list-check.checked { background: var(--green); border-color: var(--green); }
    .list-item-text { font-size: 14px; color: var(--t1); flex: 1; }
    .list-item-del {
      color: var(--t3); cursor: pointer; padding: 4px;
      transition: opacity .15s ease;
    }
    .list-item-del:active { opacity: 0.5; }

    .period-warning {
      display: flex; align-items: center; gap: 6px;
      padding: 9px 12px;
      background: rgba(var(--red-rgb),0.08); border: 0.5px solid rgba(var(--red-rgb),0.22);
      border-radius: 10px; font-size: 13px; color: var(--red);
    }

    /* ── VOICE OVERLAY ────────────────────────────────── */
    .voice-ov {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,0.84);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .voice-ring {
      width: 80px; height: 80px; border-radius: 50%;
      background: rgba(var(--accent-rgb),0.16); border: 2px solid rgba(var(--accent-rgb),0.38);
      display: flex; align-items: center; justify-content: center; color: var(--accent);
      margin-bottom: 18px;
      animation: voicePulse 1.5s ease-in-out infinite;
    }
    @keyframes voicePulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb),0.3); }
      50% { box-shadow: 0 0 0 18px rgba(var(--accent-rgb),0); }
    }
    .voice-hint { font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.8); margin-bottom: 16px; }
    .voice-text { font-size: 15px; text-align: center; max-width: 280px; line-height: 1.55; min-height: 48px; }
    .voice-cancel {
      padding: 10px 22px; border-radius: 20px;
      background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.7);
      font-size: 14px; cursor: pointer; transition: opacity .15s ease;
    }
    .voice-cancel:active { opacity: 0.65; }

    /* ── NOTIFICATION BANNER ──────────────────────────── */
    .nb {
      position: fixed;
      top: calc(var(--sai,0px) + 8px);
      left: 12px; right: 12px;
      z-index: 600;
      background: var(--glass-bg2);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 0.5px solid var(--glass-border);
      border-radius: 16px; padding: 10px 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.28);
      animation: nbIn .28s var(--sp) forwards;
      cursor: pointer;
    }
    @keyframes nbIn { from{transform:translateY(-110%);opacity:0} to{transform:translateY(0);opacity:1} }
    .nb.out { animation: nbOut .28s var(--sp) forwards; }
    @keyframes nbOut { to{transform:translateY(-110%);opacity:0} }
    .nb-hdr { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
    .nb-icon { width: 18px; height: 18px; border-radius: 5px; background: rgba(var(--accent-rgb),0.15); display: flex; align-items: center; justify-content: center; color: var(--accent); }
    .nb-app  { font-size: 11px; font-weight: 700; color: var(--t2); flex: 1; }
    .nb-time { font-size: 10px; color: var(--t3); }
    .nb-title { font-size: 14px; font-weight: 600; color: var(--t1); }
    .nb-body  { font-size: 12px; color: var(--t2); margin-top: 2px; }

    /* ── GALLERY OVERLAY ──────────────────────────────── */
    .gallery-ov {
      position: fixed; inset: 0; z-index: 200;
      background: #000;
      display: flex; flex-direction: column;
    }
    .gallery-img-wrap {
      flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .gallery-img-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .gallery-strip {
      display: flex; gap: 6px;
      padding: calc(8px + env(safe-area-inset-bottom,0px)) 12px 8px;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      flex-shrink: 0; scrollbar-width: none;
      background: rgba(0,0,0,0.6);
    }
    .gallery-strip::-webkit-scrollbar { display: none; }
    .gallery-thumb {
      width: 52px; height: 52px; border-radius: 8px; overflow: hidden;
      flex-shrink: 0; border: 2px solid transparent; cursor: pointer;
      transition: border-color .15s ease;
    }
    .gallery-thumb.on { border-color: var(--accent); }
    .gallery-thumb img { width: 100%; height: 100%; object-fit: cover; }

    /* ── AVATAR ───────────────────────────────────────── */
    .av {
      border-radius: 50%; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .av img { width: 100%; height: 100%; object-fit: cover; }

    /* ── FAB (Floating Action Button) ────────────────── */
    /* FIX #7: positioned above tab bar, bottom-right */
    .gfab {
      position: fixed;
      bottom: calc(58px + env(safe-area-inset-bottom,0px) + 16px);
      right: 20px;
      z-index: 90;
      width: 52px; height: 52px; border-radius: 50%;
      background: rgba(var(--accent-rgb),0.15);
      border: 0.5px solid rgba(var(--accent-rgb),0.28);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--accent);
      transition: transform .15s ease, opacity .15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .gfab[hidden] { display: none !important; }
    .gfab:active  { transform: scale(0.92); }

    /* ── MISC UTILITIES ───────────────────────────────── */
    svg { display: inline-block; vertical-align: middle; }
    img { display: block; }
    button { cursor: pointer; border: none; outline: none; background: none; font-family: inherit; }
    a { color: inherit; text-decoration: none; }

    /* Hide all scrollbars globally */
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="wp"></div>
  <div id="app"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
